<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #333; }
  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1024px;
    max-height: 768px;
    background: #111;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  @media (min-aspect-ratio: 4/3) { #game-wrapper { width: 133.33vh; height: 100vh; } }
  canvas {
    aspect-ratio: 4 / 3;
    max-width: 100%;
    max-height: calc(100% - 70px);
    background: #555;
  }
  .hud { position: absolute; top:0; width: 100%; height: 60px; background: red; }
</style>
</head>
<body>
<div id="game-wrapper">
  <div class="hud"></div>
  <canvas></canvas>
</div>
</body>
</html>
